<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplyIntern</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="auth-page">
      <div class="hero-panel">
        <div class="hero-content">
          <div class="hero-logo">SimplyIntern</div>
          <h1 class="hero-title">Find internships for you.</h1>
          <p class="hero-desc">Browse and discover internship opportunities tailored to your field and location, all in one place.</p>
        </div>
      </div>
      <div class="form-panel">
        <div class="form-content">
          <h2 class="form-title">Welcome back</h2>
          <p class="form-subtitle">Log in to your account</p>
          <div class="field-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Your username" required/>
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required/>
          </div>
          <button type="button" class="primary-btn" onclick="logIn()">Log In</button>
          <div class="breaker"><span>or</span></div>
          <button type="button" class="google-btn" onclick="googleSignIn()">
            <img src="images/google.webp" alt="" class="google-logo">
            Continue with Google
          </button>
          <p class="auth-switch">Don't have an account? <a href="signup.html" class="auth-link">Sign up</a></p>
        </div>
      </div>
    </div>
    <script src="js/auth.js?v=2"></script>
  </body>
</html>
