<!DOCTYPE html>
<html lang="en">
  <head>
    <script defer src="/_vercel/insights/script.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimplyIntern</title>
    <link rel="stylesheet" href="css/styles.css?v=6" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/auth.css?v=5" />
    <script src="js/config.js"></script>
    <script src="js/util.js?v=6"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="auth-page">
      <div class="hero-panel">
        <div class="hero-content">
          <div class="hero-logo"><img class="hero-logo_img" src="images/wordmark.png" alt="SimplyIntern" /></div>
          <h1 class="hero-title">Find internships for you.</h1>
          <p class="hero-desc">Browse and discover internship opportunities tailored to your field and location, all in one place.</p>
        </div>
      </div>
      <div class="form-panel">
        <div class="form-content">
          <h2 class="form-title">Welcome back</h2>
          <p class="form-subtitle">Log in to your account</p>
          <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required/>
          </div>
          <div class="field-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required/>
          </div>
          <button type="button" class="primary-btn" id="login_btn">Log In</button>
          <p class="verify-notice" id="verify_notice" style="display:none;">
            Your email isn’t verified yet. Check your inbox for the link.
            <a href="#" class="auth-link" id="resend_link">Resend email</a>
          </p>
          <p class="auth-switch"><a href="#" class="auth-link" id="forgot_link">Forgot password?</a></p>
          <div class="breaker"><span>or</span></div>
          <button type="button" class="google-btn" id="google_btn">
            <img src="images/google.webp" alt="" class="google-logo">
            Continue with Google
          </button>
          <p class="auth-switch">Don't have an account? <a href="signup.html" class="auth-link">Sign up</a></p>
        </div>
      </div>
    </div>
    <script src="js/auth.js?v=6"></script>
  </body>
</html>
