<!DOCTYPE html>
<html lang="en">
  <head>
    <script defer src="/_vercel/insights/script.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — SimplyIntern</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <script src="js/config.js"></script>
    <script src="js/util.js?v=3"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="auth-page">
      <div class="hero-panel">
        <div class="hero-content">
          <div class="hero-logo">SimplyIntern</div>
          <h1 class="hero-title">Set a new password.</h1>
          <p class="hero-desc">Choose a new password for your account and you'll be back to tracking internships in no time.</p>
        </div>
      </div>
      <div class="form-panel">
        <div class="form-content">
          <h2 class="form-title">Reset password</h2>
          <p class="form-subtitle">Enter your new password below</p>
          <div class="field-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="Create a new password" required/>
          </div>
          <div class="field-group">
            <label for="con_password">Confirm Password</label>
            <input type="password" id="con_password" name="con_password" placeholder="Repeat your new password" required/>
          </div>
          <button type="button" class="primary-btn" id="reset_btn">Update Password</button>
          <p class="auth-switch" id="reset_status"></p>
          <p class="auth-switch"><a href="index.html" class="auth-link">Back to log in</a></p>
        </div>
      </div>
    </div>
    <script src="js/reset-password.js"></script>
  </body>
</html>
