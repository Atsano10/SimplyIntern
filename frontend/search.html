<!DOCTYPE html>
<html lang="en">
  <head>
    <script defer src="/_vercel/insights/script.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search — SimplyIntern</title>
    <link rel="stylesheet" href="css/styles.css?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/search.css?v=5" />
    <script src="js/config.js"></script>
    <script src="js/util.js?v=5"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="menu_bar">
      <div class="logo"><img class="logo_img" src="images/wordmark.png" alt="SimplyIntern" /></div>
      <div class="nav_section"><a href="search.html">Search</a></div>
      <div class="nav_section"><a href="saved.html">Saved</a></div>
      <div class="nav_section"><a href="leaderboard.html">Leaderboard</a></div>
      <div class="nav_section"><a href="tracker.html">Tracker</a></div>
      <button class="additional">&#9776;</button>
    </div>

    <div class="page_content">
      <div class="search_engine">
        <input type="text" id="search_input" class="search_input" placeholder="Search internships, companies, or roles..." />
        <div class="search_filters">
          <div class="filter_multi">
            <button type="button" class="filter_multi_btn" id="ms_location_btn"
                    data-all="All Locations">
              <span class="ms_label">All Locations</span>
              <span class="ms_caret">▾</span>
            </button>
            <div class="filter_multi_panel" id="ms_location_panel"></div>
          </div>
          <div class="filter_multi">
            <button type="button" class="filter_multi_btn" id="ms_industry_btn"
                    data-all="All Industries">
              <span class="ms_label">All Industries</span>
              <span class="ms_caret">▾</span>
            </button>
            <div class="filter_multi_panel" id="ms_industry_panel"></div>
          </div>
          <div class="filter_multi">
            <button type="button" class="filter_multi_btn" id="ms_type_btn"
                    data-all="All Types">
              <span class="ms_label">All Types</span>
              <span class="ms_caret">▾</span>
            </button>
            <div class="filter_multi_panel" id="ms_type_panel"></div>
          </div>
          <button class="search_btn" id="search_btn">Search</button>
          <button class="clear_btn" id="clear_btn">Clear</button>
        </div>
        <div class="search_filters search_filters_secondary">
          <select id="sort_select" class="filter_dropdown" aria-label="Sort results">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="company">Company A–Z</option>
          </select>
          <select id="posted_select" class="filter_dropdown" aria-label="Posted within">
            <option value="">Any time</option>
            <option value="7">Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30">Last 30 days</option>
          </select>
          <label class="filter_toggle"><input type="checkbox" id="remote_only" /> Remote only</label>
        </div>
      </div>

      <div class="results_area">
        <div class="empty_state" id="empty_state">
          <p class="empty_title">Find your next internship</p>
          <p class="empty_sub">Use the filters above and click Search to browse listings.</p>
        </div>
        <div class="job_list" id="job_list"></div>
      </div>
    </div>

    <script src="js/auth.js?v=5"></script>
    <script src="js/nav.js?v=5"></script>
    <script src="js/api.js?v=5"></script>
    <script src="js/locations.js?v=5"></script>
    <script src="js/search.js?v=5"></script>
  </body>
</html>
